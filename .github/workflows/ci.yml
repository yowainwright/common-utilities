name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Review runtime dependency changes
        uses: actions/dependency-review-action@a1d28236b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
          license-check: false

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        name: Install pnpm
        with:
          version: 11.18.0

      - name: Install shell lint tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends shellcheck
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          HOMEBREW_NO_AUTO_UPDATE=1 brew tap yowainwright/shellcheck_legibility https://github.com/yowainwright/shellcheck_legibility
          HOMEBREW_NO_AUTO_UPDATE=1 brew trust --formula yowainwright/shellcheck_legibility/shellcheck-legibility
          HOMEBREW_NO_AUTO_UPDATE=1 brew install shellcheck-legibility

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        name: Setup Node.js
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - run: pnpm run lint:shell
      - run: pnpm run lint:ci
      - run: pnpm run build
      - name: Run tests
        run: pnpm run test:ci
        env:
          CI: true
