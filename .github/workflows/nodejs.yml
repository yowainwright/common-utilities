name: Node.js CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [26.x]

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - name: Install shell lint tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends shellcheck
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          HOMEBREW_NO_AUTO_UPDATE=1 brew tap yowainwright/shellcheck_legibility https://github.com/yowainwright/shellcheck_legibility
          HOMEBREW_NO_AUTO_UPDATE=1 brew trust --formula yowainwright/shellcheck_legibility/shellcheck-legibility
          HOMEBREW_NO_AUTO_UPDATE=1 brew install shellcheck-legibility
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint:shell
      - run: pnpm run lint:ci
      - run: pnpm build
      - run: pnpm test
        env:
          CI: true
